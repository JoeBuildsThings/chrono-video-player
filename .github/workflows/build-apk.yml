name: Build Chrono Player APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: Chrono-Player-v1.0.${{ github.run_number }}.apk

jobs:
  build-android:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Expo Prebuild Native Android Directory
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename APK for Release
        run: cp android/app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chrono-Player-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chrono Player v1.0.${{ github.run_number }}
          body: "Standalone Android APK built by GitHub Actions. Download the APK file below, then install it on your Android device."
          files: ${{ env.APK_NAME }}
