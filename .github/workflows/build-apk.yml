name: Build Chrono Player APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Expo Prebuild Native Android Directory
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Memory and Assemble Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Chrono-Player-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chrono-Player-APK
          path: ./Chrono-Player-v1.0.0.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Chrono Player v1.0.${{ github.run_number }} (MX + VLC Hybrid)"
          body: "Automated standalone Android APK build for Chrono Player."
          files: ./Chrono-Player-v1.0.0.apk
